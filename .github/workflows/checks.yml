name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  observability-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Validate offline observability reports
        run: PYTHONPATH=tools/bench python3 -O -m unittest test_request_cost_report test_gemma_regression
      - name: Validate paired measurement contracts
        run: PYTHONPATH=tools/experiments python3 -O -m unittest test_o1_gemma_summary test_o2_gemma_workloads
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Fetch locked dependencies
        run: cargo +1.90.0 fetch --locked
      - name: Check formatting
        run: cargo +1.90.0 fmt --check
      - name: Lint
        run: cargo +1.90.0 clippy --locked --offline --all-targets -- -D warnings
      - name: Test
        run: cargo +1.90.0 test --locked --offline
      - name: Build release CLI
        run: cargo +1.90.0 build --locked --offline --release
