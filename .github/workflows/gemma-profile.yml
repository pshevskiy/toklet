name: Gemma profile report checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Validate offline Gemma profiles
        run: python3 tools/bench/test_gemma_profile_report.py
      - name: Validate with Python assertions disabled
        run: python3 -O tools/bench/test_gemma_profile_report.py
