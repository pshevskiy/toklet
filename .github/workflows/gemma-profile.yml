name: Gemma report checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Validate offline Gemma profiles
        run: python3 tools/bench/test_gemma_profile_report.py
      - name: Validate with Python assertions disabled
        run: python3 -O tools/bench/test_gemma_profile_report.py
      - name: Validate ordinary submission reports
        run: python3 tools/bench/test_gemma_submission_report.py
      - name: Validate submission reports with Python assertions disabled
        run: python3 -O tools/bench/test_gemma_submission_report.py
      - name: Validate ordinary CLI request summaries
        run: python3 -B tools/bench/test_gemma_cli_report.py
      - name: Validate CLI request summaries with Python assertions disabled
        run: python3 -O -B tools/bench/test_gemma_cli_report.py
