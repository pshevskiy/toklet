[package]
name = "toklet"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A small Rust inference engine for Apple Silicon"
license = "Apache-2.0"
publish = false

[[bin]]
name = "toklet"
path = "src/bin/toklet.rs"

[dependencies]
half = { version = "=2.7.1", features = ["std"] }
safetensors = "=0.6.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["float_roundtrip"] }

[dev-dependencies]
sha2 = "=0.10.9"
